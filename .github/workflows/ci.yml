name: CI

on:
  push:
    branches: [main]
    # Pushing a version tag (v1.2.3) runs the same checks, then publishes to npm.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke test bundle
        run: bun run smoke

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 7

  npx:
    name: npx (Node ${{ matrix.node }}, ${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package

      - name: Run packed package with npx
        shell: bash
        run: |
          tgz="$(ls "$PWD"/package/*.tgz)"
          if [ "$RUNNER_OS" = "Windows" ]; then tgz="$(cygpath -w "$tgz")"; fi
          # Run outside the checkout so npx installs the tarball instead of using this project.
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/scripts/smoke.mjs" npx -y "--package=$tgz" mcp-rest-api

  publish:
    name: Publish to npm
    needs: [test, npx]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package

      - name: Publish the tested tarball
        shell: bash
        run: |
          npm --version
          # Versions with a prerelease part (1.2.0-beta.1) go to the "next" dist-tag, not "latest".
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; else tag=latest; fi
          # "./" is required: npm reads "package/x.tgz" as a GitHub "user/repo" shorthand.
          npm publish ./package/*.tgz --tag "$tag"
